name = "blog-comments"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# Development settings
[vars]
ALLOWED_ORIGIN = "https://jamesharr.is"
BLOG_URL = "https://jamesharr.is"

# Secrets (set via `wrangler secret put`):
