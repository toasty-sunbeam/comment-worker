name = "blog-comments"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# Development settings
[vars]
ALLOWED_ORIGIN = "https://jamesharr.is"
BLOG_URL = "https://jamesharr.is"

# Secrets (set via `wrangler secret put`):
# - GITHUB_TOKEN: Personal access token with repo scope
# - GITHUB_REPO: "owner/repo" format
# - AKISMET_API_KEY: Your Akismet API key (get one at https://akismet.com/)
#
# Optional, for "new comment" Telegram notifications. Leave both unset to
# disable notifications; the worker skips them silently.
# - TELEGRAM_BOT_TOKEN: Bot token from @BotFather
# - TELEGRAM_CHAT_ID: The chat to notify (yours)
